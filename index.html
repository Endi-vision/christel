<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0D0B">
<title>Tu veux aller au cinema ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0A0D0B;      /* fond de page */
    --crypt: #161D14;      /* carte */
    --bone: #E6EBD3;       /* texte */
    --blood: #C2131F;      /* bouton Oui */
    --blood-deep: #6B0C15; /* ombres */
    --slime: #8DBB3F;      /* vert zombie */
    --ink: #0A0D0B;        /* bordures et texte sur fond clair */
    --rim: #3A4A32;        /* contour de la carte */
    --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --edge: 3px;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding:
      max(16px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(16px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    background: var(--night);
    color: var(--bone);
    font-family: var(--body);
    /* Pas de zoom au double tap, pas de sélection ni de menu au appui long */
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .card {
    position: relative;
    width: min(100%, 420px);
    margin-top: 66px; /* le sticker dépasse en haut */
    padding: 88px 22px 28px;
    background: var(--crypt);
    border: var(--edge) solid var(--rim);
    border-radius: 28px;
    box-shadow: 6px 6px 0 var(--blood-deep);
    text-align: center;
  }

  .sticker {
    position: absolute;
    left: 50%;
    top: 0;
    width: 132px;
    height: 132px;
    display: grid;
    place-items: center;
    overflow: hidden;
    border: var(--edge) solid var(--ink);
    border-radius: 50%;
    background: var(--slime);
    box-shadow: 4px 4px 0 var(--blood-deep);
    font-size: 72px;
    line-height: 1;
    transform: translate(-50%, -50%) rotate(-6deg);
  }
  .sticker img { width: 100%; height: 100%; object-fit: cover; }
  .sticker.pop { animation: pop .4s; }

  @keyframes pop {
    0%   { transform: translate(-50%, -50%) rotate(-6deg) scale(1); }
    35%  { transform: translate(-50%, -50%) rotate(8deg) scale(1.14); }
    100% { transform: translate(-50%, -50%) rotate(-6deg) scale(1); }
  }

  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2rem, 9.5vw, 3.2rem);
    line-height: 1.05;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  h1:focus { outline: none; }

  .lead { margin: 14px 0 0; font-size: 1.15rem; font-weight: 700; }

  .idea {
    margin: 20px 0 0;
    padding: 14px 16px;
    background: var(--night);
    border: var(--edge) solid var(--slime);
    border-radius: 18px;
    font-size: 1.05rem;
    font-weight: 700;
    text-wrap: balance;
    transform: rotate(1deg);
  }

  .actions {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 58px;
    min-width: 150px;
    padding: 0 28px;
    border: var(--edge) solid var(--ink);
    border-radius: 999px;
    color: var(--ink);
    font-family: var(--display);
    font-size: 1.35rem;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--blood-deep);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--blood-deep); }
  .btn:focus-visible { outline: 3px solid var(--bone); outline-offset: 4px; }

  .yes { background: var(--blood); color: var(--bone); }
  .no  { background: var(--slime); }

  /* Le bouton Oui grossit à chaque esquive du Non */
  .yes-wrap {
    transform: scale(var(--s, 1));
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
  }

  /* Réserve la place du Non pour que la mise en page ne bouge pas quand il s'échappe */
  .no-slot { height: 58px; min-width: 150px; display: grid; place-items: center; }

  .no.loose {
    position: fixed;
    z-index: 10;
    margin: 0;
    transition:
      left .3s cubic-bezier(.34, 1.56, .64, 1),
      top .3s cubic-bezier(.34, 1.56, .64, 1),
      transform .12s, box-shadow .12s;
  }

  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 30;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<main class="card">
  <div class="sticker" id="sticker" aria-hidden="true"></div>

  <section id="ask">
    <h1 id="askTitle"></h1>
    <div class="actions">
      <div class="yes-wrap" id="yesWrap">
        <button class="btn yes" id="yesBtn" type="button">Oui</button>
      </div>
      <div class="no-slot">
        <button class="btn no" id="noBtn" type="button">Non</button>
      </div>
    </div>
  </section>

  <section id="yes" hidden>
    <h1 id="yesTitle" tabindex="-1"></h1>
    <p class="lead" id="yesText"></p>
    <p class="idea" id="idea" aria-live="polite" hidden></p>
    <div class="actions">
      <button class="btn yes" id="ideaBtn" type="button">On fait quoi aprés ?</button>
      <a class="btn no" id="reply" target="_blank" rel="noopener" hidden></a>
    </div>
  </section>
</main>

<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
  "use strict";

  /* ------------------------------------------------------------------
     À PERSONNALISER
     ------------------------------------------------------------------ */
  const CONFIG = {
    name: "Christel",                                  // ex. "Léa" → « Léa, tu veux sortir avec moi ? »
    question: "Tu viens voir le film de zo ... d'horreur avec moi ?",
    yesTitle: "Yesss !",
    yesText: "🧟‍♀️🍻🧟‍♂️",

    // Textes successifs du bouton Non (le dernier reste affiché ensuite)
    noLabels: ["Non", "Sûr ?", "Vraiment ?", "Réfléchis…", "Allez…", "Non non non", "Dernière chance", "Arrrghhh arrgh 🧟"],

    // Optionnel : une image/GIF à la place de l'emoji (URL complète), sinon laisser vide
    imageAsk: "",
    imageYes: "https://static.vecteezy.com/system/resources/previews/066/833/935/non_2x/zombie-hands-forming-heart-shape-with-red-heart-symbol-illustration-for-halloween-and-horror-themes-vector.jpg",   // ex. "https://media.giphy.com/media/UMon0fuimoAN9ueUNP/giphy.gif"

    // Optionnel : bouton pour répondre après le « Oui ». Exemples :
    //   "https://wa.me/33612345678?text=Oui%20%21"
    //   "sms:+33674846962?&body=Oui%20%21"
    replyLink: "sms:+33674846962?&body=Oui%20%21",
    replyLabel: "Répondre par message",
  };

  const IDEAS = [
    "Un shooting pied",
    "Le jeu d'horreur sur netflix",
    "Je te regarde faire ton duolingo pendant des heures",
    "Un débat sur le féminisme",
    "On picole !!!",
    "Un autre film, plaids et popcorn !",
    "Atelier teinture de frange",
    "Un shooting pied",
    "Un massage crème chauffante !! (J'ai encore un peu de douleur intercostale)",
    "On casse tes legos pour les refaire",
    "On s'habille en noir et on se roule dans l'appart",
    "Un tutoriel onlyfans",
    "Un jeu de société un peu alcoolisé",
    "Je te déguise en Roumaine",
    "On boit du gaspacho jusqu'à l'aube",
    "Le premier qui atteint 5000 pas en agitant son tél a gagné",
    "Je complimente ta frange toute la soirée",
    "Un resto !",
    "Le MINIGOLF netflix bordel",
    "La saison 1 de Walking Dead",
    "On cuisine un truc de fou sans plan de travail",
    "On refait l'arbre généalogique de Jean-mi ... Brigitte",
    "Une dégustation de vin et fromage",
    "Un massage crème chauffante!! (J'ai encore un peu de douleur intercostale)",
    "On va voir les meilleurs comptes de pied sur insta",
    "Un marathon Harry Potter",
    "On regarde des pubs pour Miko et on compare avec ton tatouage",
    "Tu me fais un tuto nettoyage de gourde avec ton truc magique la",
  ];

  const MOODS = [[0, "🧟‍♀️"], [3, "🧟‍♂️"], [6, "🧟"], [10, "☠️"]];

  /* ------------------------------------------------------------------ */

  const $ = (sel) => document.querySelector(sel);
  const card = $(".card");
  const sticker = $("#sticker");
  const askView = $("#ask"), yesView = $("#yes");
  const askTitle = $("#askTitle"), yesTitle = $("#yesTitle"), yesText = $("#yesText");
  const yesWrap = $("#yesWrap"), yesBtn = $("#yesBtn"), noBtn = $("#noBtn");
  const ideaBtn = $("#ideaBtn"), idea = $("#idea"), reply = $("#reply");

  let count = 0;        // nombre d'esquives
  let loose = false;    // le bouton Non est-il sorti du flux ?
  let done = false;     // le Oui a-t-il été cliqué ?
  let lastDodge = 0;

  /* ---------- Textes ---------- */
  const q = CONFIG.question;
  const headline = CONFIG.name ? `${CONFIG.name}, ${q.charAt(0).toLowerCase()}${q.slice(1)}` : q;
  askTitle.textContent = headline;
  document.title = headline;
  yesTitle.textContent = CONFIG.yesTitle;
  yesText.textContent = CONFIG.yesText;

  if (CONFIG.replyLink) {
    reply.href = CONFIG.replyLink;
    reply.textContent = CONFIG.replyLabel;
    reply.hidden = false;
  }

  /* ---------- Sticker ---------- */
  function wiggle() {
    sticker.classList.remove("pop");
    void sticker.offsetWidth; // relance l'animation
    sticker.classList.add("pop");
  }

  function setSticker(kind, emoji) {
    const url = kind === "yes" ? CONFIG.imageYes : CONFIG.imageAsk;
    sticker.replaceChildren();
    if (url) {
      const img = new Image();
      img.alt = "";
      img.src = url;
      sticker.append(img);
    } else {
      sticker.textContent = emoji;
    }
    wiggle();
  }

  function updateMood() {
    if (!CONFIG.imageAsk) {
      const mood = MOODS.filter(([n]) => count >= n).pop()[1];
      sticker.textContent = mood;
    }
    wiggle();
  }

  /* ---------- Bouton Oui qui grossit ---------- */
  function growYes() {
    const room = card.clientWidth - 40;
    const max = Math.max(1, Math.min(1.9, room / yesBtn.offsetWidth));
    const s = Math.min(max, 1 + count * 0.08);
    yesWrap.style.setProperty("--s", s.toFixed(3));
    return s;
  }

  /* ---------- Bouton Non qui s'échappe ---------- */
  const pad = () => {
    const cs = getComputedStyle(document.body);
    return {
      t: parseFloat(cs.paddingTop) || 16,
      r: parseFloat(cs.paddingRight) || 16,
      b: parseFloat(cs.paddingBottom) || 16,
      l: parseFloat(cs.paddingLeft) || 16,
    };
  };
  const inflate = (r, g) => ({ left: r.left - g, top: r.top - g, right: r.right + g, bottom: r.bottom + g });
  const overlap = (a, b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), Math.max(lo, hi));

  // Sort le bouton du flux sans qu'il saute visuellement
  function detach() {
    if (loose) return;
    const r = noBtn.getBoundingClientRect();
    noBtn.style.transition = "none";
    noBtn.classList.add("loose");
    noBtn.style.left = r.left + "px";
    noBtn.style.top = r.top + "px";
    void noBtn.offsetWidth;
    noBtn.style.transition = "";
    loose = true;
  }

  function dodge(px, py) {
    if (done) return;
    lastDodge = performance.now();

    detach();
    count++;
    noBtn.textContent = CONFIG.noLabels[Math.min(count, CONFIG.noLabels.length - 1)];
    updateMood();
    const scale = growYes();

    const cur = noBtn.getBoundingClientRect();
    const w = cur.width, h = cur.height;
    const p = pad();
    const vw = document.documentElement.clientWidth;
    const vh = window.innerHeight;
    const minX = p.l, maxX = vw - p.r - w;
    const minY = p.t, maxY = vh - p.b - h;

    const from = {
      x: px ?? cur.left + w / 2,
      y: py ?? cur.top + h / 2,
    };

    // Zone du bouton Oui une fois agrandi (le centre ne bouge pas quand on scale)
    const yb = yesBtn.getBoundingClientRect();
    const cx = yb.left + yb.width / 2, cy = yb.top + yb.height / 2;
    const bw = yesBtn.offsetWidth * scale, bh = yesBtn.offsetHeight * scale;
    const yesRect = inflate({ left: cx - bw / 2, top: cy - bh / 2, right: cx + bw / 2, bottom: cy + bh / 2 }, 10);

    const strict = [yesRect, inflate(askTitle.getBoundingClientRect(), 10), inflate(sticker.getBoundingClientRect(), 10)];

    const pick = (avoid, minFromPointer) => {
      const ok = [];
      for (let i = 0; i < 70; i++) {
        const x = minX + Math.random() * Math.max(0, maxX - minX);
        const y = minY + Math.random() * Math.max(0, maxY - minY);
        const box = { left: x, top: y, right: x + w, bottom: y + h };
        if (avoid.some((a) => overlap(a, box))) continue;
        if (Math.hypot(x + w / 2 - from.x, y + h / 2 - from.y) < minFromPointer) continue;
        ok.push({ x, y });
      }
      return ok.length ? ok[Math.floor(Math.random() * ok.length)] : null;
    };

    // On essaie d'abord d'éviter texte + sticker + Oui, puis on assouplit
    const spot = pick(strict, 130) || pick([yesRect], 90) || pick([], 60) || { x: minX, y: minY };

    noBtn.style.left = spot.x + "px";
    noBtn.style.top = spot.y + "px";
    if (navigator.vibrate) navigator.vibrate(12);
  }

  // Tactile, souris et stylet : « pointerdown » remplace le « mouseover » qui n'existe pas sur mobile
  noBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    dodge(e.clientX, e.clientY);
  });

  // Empêche le « clic fantôme » sur les anciens navigateurs mobiles
  noBtn.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });

  // Clavier (Entrée / Espace) : le Non fuit aussi
  noBtn.addEventListener("click", (e) => {
    e.preventDefault();
    dodge();
  });

  // Souris : le bouton fuit dès que le curseur s'approche
  document.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse" || done || performance.now() - lastDodge < 250) return;
    const r = noBtn.getBoundingClientRect();
    const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
    const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    if (Math.hypot(dx, dy) < 40) dodge(e.clientX, e.clientY);
  });

  // Rotation de l'écran / redimensionnement : le Non reste visible
  window.addEventListener("resize", () => {
    if (!loose || done) return;
    const r = noBtn.getBoundingClientRect();
    const p = pad();
    noBtn.style.left = clamp(r.left, p.l, document.documentElement.clientWidth - p.r - r.width) + "px";
    noBtn.style.top = clamp(r.top, p.t, window.innerHeight - p.b - r.height) + "px";
    growYes();
  });

  /* ---------- Oui ! ---------- */
  yesBtn.addEventListener("click", () => {
    done = true;
    noBtn.hidden = true;
    askView.hidden = true;
    yesView.hidden = false;
    setSticker("yes", "🧟‍♀️🍻🧟‍♂️");
    confetti();
    if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
    yesTitle.focus({ preventScroll: true });
  });

  let lastIdea = -1;
  ideaBtn.addEventListener("click", () => {
    let i;
    do { i = Math.floor(Math.random() * IDEAS.length); } while (i === lastIdea);
    lastIdea = i;
    idea.textContent = IDEAS[i];
    idea.hidden = false;
    ideaBtn.textContent = "Une autre idée";
  });

  /* ---------- Confettis ---------- */
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const canvas = $("#confetti");
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = window.innerWidth, H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);

    const colors = ["#C2131F", "#8DBB3F", "#E6EBD3", "#6B0C15", "#4C6B23"];
    const parts = Array.from({ length: 150 }, () => ({
      x: W / 2,
      y: H * 0.45,
      vx: (Math.random() - 0.5) * 15,
      vy: -Math.random() * 15 - 4,
      s: 6 + Math.random() * 7,
      r: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.4,
      c: colors[Math.floor(Math.random() * colors.length)],
    }));

    const start = performance.now();
    (function frame(now) {
      ctx.clearRect(0, 0, W, H);
      for (const p of parts) {
        p.vy += 0.35;
        p.vx *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        p.r += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6);
        ctx.restore();
      }
      if (now - start < 4500 && parts.some((p) => p.y < H + 20)) {
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, W, H);
      }
    })(start);
  }

  /* ---------- Démarrage ---------- */
  setSticker("ask", "🧟‍♂️");
})();
</script>
</body>
</html>
